<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Document Portal{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fb; --surface: #ffffff; --surface-2: #f8fafc;
      --line: #e6e9f2; --line-strong: #d5dae6;
      --fg: #0f172a; --fg-2: #334155; --muted: #64748b; --faint: #94a3b8;
      --accent: #4f46e5; --accent-2: #7c3aed; --accent-soft: #eef2ff; --accent-ring: rgba(79,70,229,.18);
      --ok: #059669; --ok-soft: #ecfdf5; --err: #dc2626; --err-soft: #fef2f2;
      --warn: #d97706; --warn-soft: #fffbeb;
      --radius: 16px; --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -6px rgba(15,23,42,.08);
      --shadow-lg: 0 2px 4px rgba(15,23,42,.04), 0 24px 48px -12px rgba(30,27,75,.14);
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --display: 'Plus Jakarta Sans', var(--font);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; font-family: var(--font); color: var(--fg); line-height: 1.55;
      background: var(--bg);
      background-image:
        radial-gradient(900px 420px at 8% -10%, rgba(124,58,237,.10), transparent 60%),
        radial-gradient(800px 380px at 100% 0%, rgba(14,165,233,.10), transparent 60%);
      background-attachment: fixed; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    svg { flex-shrink: 0; }

    /* ---------- top bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,.78); backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-in { max-width: 1120px; margin: 0 auto; padding: 12px 20px;
                 display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--fg);
             font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff;
                  background: linear-gradient(135deg, var(--accent), var(--accent-2));
                  box-shadow: 0 6px 16px -4px rgba(79,70,229,.5); }
    .nav { display: flex; gap: 4px; }
    .nav a { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 9px;
             color: var(--muted); font-size: .9rem; font-weight: 500; transition: background .15s, color .15s; }
    .nav a:hover { background: var(--surface-2); color: var(--fg); }
    .nav a.on { background: var(--accent-soft); color: var(--accent); }

    /* ---------- layout ---------- */
    .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 20px 72px; }
    .wrap.narrow { max-width: 760px; }
    .page-head { margin-bottom: 28px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600;
               color: var(--accent); background: var(--accent-soft); padding: 5px 11px; border-radius: 999px;
               margin-bottom: 14px; letter-spacing: .01em; }
    h1 { font-family: var(--display); font-size: clamp(1.6rem, 3.2vw, 2.15rem); line-height: 1.2;
         letter-spacing: -.025em; font-weight: 800; margin: 0 0 8px; }
    h2 { font-family: var(--display); font-size: 1.2rem; letter-spacing: -.015em; margin: 0 0 4px; font-weight: 700; }
    .sub { color: var(--muted); margin: 0; font-size: 1rem; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
            padding: 28px; box-shadow: var(--shadow); margin-bottom: 20px; }

    /* ---------- forms ---------- */
    label, .label { display: block; font-size: .85rem; font-weight: 600; color: var(--fg-2); margin-bottom: 8px; }
    .field { position: relative; }
    .field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
    input[type=text] {
      width: 100%; padding: 12px 14px 12px 42px; border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg);
      font: inherit; font-size: .98rem; transition: border-color .15s, box-shadow .15s;
    }
    input[type=text]::placeholder { color: var(--faint); }
    input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); }
    .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .row > div { flex: 1; min-width: 200px; }

    .btn, button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font: inherit; font-weight: 600; font-size: .95rem; cursor: pointer; border: 0;
      padding: 12px 20px; border-radius: var(--radius-sm); color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 20px -8px rgba(79,70,229,.65), inset 0 1px 0 rgba(255,255,255,.18);
      transition: transform .12s, box-shadow .15s, opacity .15s; white-space: nowrap;
    }
    .btn:hover, button:hover { transform: translateY(-1px); box-shadow: 0 12px 24px -8px rgba(79,70,229,.7), inset 0 1px 0 rgba(255,255,255,.18); }
    .btn:active, button:active { transform: translateY(0); }
    button:disabled { opacity: .55; cursor: default; transform: none; }
    .btn.ghost, button.ghost {
      background: var(--surface); color: var(--fg-2); border: 1px solid var(--line-strong);
      box-shadow: var(--shadow-sm); padding: 9px 14px; font-size: .88rem;
    }
    .btn.ghost:hover, button.ghost:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--shadow-sm); }
    .btn.block { width: 100%; }

    .alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-sm);
             font-size: .92rem; margin-bottom: 20px; }
    .alert.err, .error { background: var(--err-soft); color: var(--err); border: 1px solid #fecaca; }
    .error { padding: 12px 14px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: .92rem; }

    /* ---------- feature strip ---------- */
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
    .feature { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px;
               background: rgba(255,255,255,.6); border: 1px solid var(--line); }
    .feature .ic { flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
    .feature b { display: block; font-size: .9rem; margin-bottom: 2px; }
    .feature span { color: var(--muted); font-size: .83rem; line-height: 1.45; }

    /* ---------- client header (tabs page) ---------- */
    .client { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .avatar { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; color: #fff;
              font-family: var(--display); font-weight: 800; font-size: 1.3rem; letter-spacing: .02em;
              background: linear-gradient(135deg, #6366f1, #a855f7 55%, #ec4899);
              box-shadow: 0 10px 24px -8px rgba(124,58,237,.55); }
    .client h1 { margin: 0 0 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
            font-size: .8rem; font-weight: 600; background: var(--surface); border: 1px solid var(--line);
            color: var(--fg-2); }
    .progress-box { margin-left: auto; min-width: 240px; background: var(--surface); border: 1px solid var(--line);
                    border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow-sm); }
    .progress-top { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 8px; }
    .progress-top b { font-family: var(--display); }
    .bar { height: 8px; border-radius: 99px; background: #eef1f6; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; border-radius: 99px;
               background: linear-gradient(90deg, #10b981, #34d399); transition: width .4s ease; }

    /* ---------- workspace: sidebar tabs + panel ---------- */
    .workspace { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 28px; }
    .sidebar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
               box-shadow: var(--shadow); padding: 12px; position: sticky; top: 80px; }
    .sidebar .field { margin: 4px 4px 10px; }
    .sidebar input[type=text] { padding: 9px 12px 9px 36px; font-size: .88rem; background: var(--surface-2); }
    .sidebar .field svg { left: 12px; }
    .tabs { display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 210px); overflow-y: auto;
            padding-right: 2px; margin: 0; }
    .tabs::-webkit-scrollbar { width: 6px; } .tabs::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 9px; }
    .tab-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
      background: transparent; color: var(--fg-2); border: 1px solid transparent; box-shadow: none;
      padding: 10px 12px; border-radius: 10px; font-size: .9rem; font-weight: 500; text-align: left;
    }
    .tab-btn:hover { background: var(--surface-2); transform: none; box-shadow: none; }
    .tab-btn.active { background: var(--accent-soft); color: var(--accent); border-color: #e0e7ff; font-weight: 600; }
    .tab-btn .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong);
                    background: var(--surface); flex-shrink: 0; position: relative; transition: all .2s; }
    .tab-btn.active .dot { border-color: #c7d2fe; }
    .tab-btn .dot.done { background: var(--ok); border-color: var(--ok); }
    .tab-btn .dot.done::after { content: ''; position: absolute; left: 4.5px; top: 1.5px; width: 4px; height: 8px;
                                border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .tab-panel { display: none; animation: fade .25s ease; }
    .tab-panel.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .panel-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    .panel-ic { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
                background: var(--accent-soft); color: var(--accent); }

    /* ---------- dropzone upload ---------- */
    .dropzone { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
                text-align: center; gap: 6px; padding: 38px 20px; border: 2px dashed var(--line-strong);
                border-radius: 14px; background: var(--surface-2); cursor: pointer; margin: 0 0 16px;
                transition: border-color .15s, background .15s; font-weight: 400; color: var(--muted); }
    .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
    .dropzone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    .dz-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 6px;
             background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
    .dz-title { color: var(--fg); font-weight: 600; font-size: .98rem; }
    .dz-title u { color: var(--accent); text-decoration: none; }
    .dz-hint { font-size: .82rem; }
    .dz-file { display: none; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 12px; border-radius: 999px;
               background: var(--surface); border: 1px solid var(--line); color: var(--fg-2); font-size: .85rem; font-weight: 500;
               max-width: 100%; }
    .dz-file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dropzone.has-file .dz-file { display: inline-flex; }
    .dropzone.is-done { border-style: solid; border-color: #a7f3d0; background: var(--ok-soft); cursor: default; }
    .dropzone.is-done .dz-ic { color: var(--ok); }
    .upload-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .upload-result { font-size: .9rem; font-weight: 500; }
    .upload-result:empty { display: none; }
    .upload-result.ok { color: var(--ok); }
    .upload-result.err { color: var(--err); }

    /* ---------- share link ---------- */
    .share { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
    .link-line { display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 14px; border-radius: 12px;
                 background: var(--surface-2); border: 1px solid var(--line); }
    .link-line code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: .8rem; color: var(--fg-2); }

    /* ---------- standalone states ---------- */
    .center-card { max-width: 560px; margin: 24px auto 0; text-align: center; padding: 40px 32px; }
    .state-ic { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 18px; }
    .state-ic.ok { background: var(--ok-soft); color: var(--ok); }
    .state-ic.warn { background: var(--warn-soft); color: var(--warn); }
    .state-ic.err { background: var(--err-soft); color: var(--err); }
    .state-ic.accent { background: var(--accent-soft); color: var(--accent); }
    .center-card .dropzone { text-align: center; }
    .center-card .upload-actions { justify-content: center; }
    .trust { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 22px;
             color: var(--muted); font-size: .8rem; }
    .trust span { display: inline-flex; align-items: center; gap: 6px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 600; }
    .badge.expired { background: var(--warn-soft); color: var(--warn); }
    .badge.submitted { background: var(--ok-soft); color: var(--ok); }

    /* ---------- documents table ---------- */
    .search-inline { display: flex; gap: 12px; }
    .search-inline .field { flex: 1; }
    .table-wrap { overflow-x: auto; margin: -8px -8px 0; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .92rem; }
    th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--faint);
         font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    td { padding: 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: var(--surface-2); }
    tbody tr:last-child td { border-bottom: 0; }
    .file-cell { display: flex; align-items: center; gap: 12px; }
    .file-ic { flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
               font-size: .62rem; font-weight: 800; letter-spacing: .03em; color: #fff; }
    .file-ic.pdf { background: #ef4444; } .file-ic.img { background: #0ea5e9; } .file-ic.aud { background: #a855f7; }
    .file-ic.doc { background: #6366f1; }
    .show-sm, .type-pill.show-sm { display: none; }
    .file-name { display: block; font-weight: 500; color: var(--fg); word-break: break-all; }
    .type-pill { display: inline-block; padding: 4px 10px; border-radius: 8px; background: var(--accent-soft);
                 color: var(--accent); font-size: .8rem; font-weight: 600; white-space: nowrap; }
    .when { color: var(--muted); white-space: nowrap; font-size: .87rem; }
    .results-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
    .count { font-size: .8rem; font-weight: 600; color: var(--muted); background: var(--surface-2);
             border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }
    .empty { text-align: center; padding: 28px 12px 12px; }
    .empty .state-ic { width: 60px; height: 60px; }

    @media (max-width: 860px) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .sidebar { position: static; }
      .tabs { flex-direction: row; flex-wrap: nowrap; overflow-x: auto; max-height: none; padding-bottom: 4px; }
      .tab-btn { width: auto; white-space: nowrap; }
      .features { grid-template-columns: 1fr; }
      .progress-box { margin-left: 0; width: 100%; }
    }
    @media (max-width: 560px) {
      .wrap { padding: 28px 16px 56px; }
      .card { padding: 20px; }
      .nav a span { display: none; }
      .search-inline { flex-direction: column; }
      .hide-sm { display: none; }
      .show-sm { display: inline-block !important; margin-top: 4px; }
    }
  </style>
</head>
<body>
  {% block topbar %}
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="/staff">
        <span class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 14 2 2 4-4"/></svg>
        </span>
        DocPortal
      </a>
      <nav class="nav">
        <a href="/staff" class="{% block nav_generate %}{% endblock %}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          <span>Generate links</span>
        </a>
        <a href="/staff/documents" class="{% block nav_documents %}{% endblock %}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Documents</span>
        </a>
      </nav>
    </div>
  </header>
  {% endblock %}

  <main class="wrap {% block wrap_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Tab switching
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.tab-btn');
      if (!btn) return;
      var key = btn.dataset.key;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.tab-panel').forEach(p =>
        p.classList.toggle('active', p.dataset.key === key));
    });

    // Filter the document-type list
    document.addEventListener('input', function (e) {
      if (!e.target.matches('[data-tab-filter]')) return;
      var q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('.tab-btn').forEach(b =>
        b.style.display = b.textContent.toLowerCase().includes(q) ? '' : 'none');
    });

    // Copy-to-clipboard
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-copy]');
      if (!btn) return;
      navigator.clipboard.writeText(btn.dataset.copy).then(() => {
        var old = btn.innerHTML; btn.textContent = 'Copied ✓';
        setTimeout(() => { btn.innerHTML = old; }, 1400);
      });
    });

    // Dropzone: show chosen file name, drag-and-drop highlight
    function showFile(input) {
      var dz = input.closest('.dropzone'); if (!dz) return;
      var name = input.files.length ? input.files[0].name : '';
      dz.classList.toggle('has-file', !!name);
      var span = dz.querySelector('.dz-file span'); if (span) span.textContent = name;
    }
    document.addEventListener('change', function (e) {
      if (e.target.matches('.dropzone input[type=file]')) showFile(e.target);
    });
    ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, function (e) {
      var dz = e.target.closest && e.target.closest('.dropzone'); if (dz) dz.classList.add('drag');
    }));
    ['dragleave', 'drop'].forEach(t => document.addEventListener(t, function (e) {
      var dz = e.target.closest && e.target.closest('.dropzone'); if (dz) dz.classList.remove('drag');
    }));
    document.addEventListener('drop', function (e) {
      if (e.target.matches('.dropzone input[type=file]')) setTimeout(() => showFile(e.target), 0);
    });

    // Progress counter on the tabs page
    function updateProgress() {
      var total = document.querySelectorAll('.tab-btn .dot').length;
      var done = document.querySelectorAll('.tab-btn .dot.done').length;
      var n = document.querySelector('[data-progress-count]');
      var bar = document.querySelector('[data-progress-bar]');
      if (n) n.textContent = done + ' / ' + total;
      if (bar) bar.style.width = (total ? (done / total) * 100 : 0) + '%';
    }

    // AJAX upload for any .upload-form (works in tabs and standalone)
    document.addEventListener('submit', async function (e) {
      var form = e.target.closest('.upload-form');
      if (!form) return;
      e.preventDefault();
      var out = form.querySelector('.upload-result');
      var submitBtn = form.querySelector('button[type=submit]');
      var fileInput = form.querySelector('input[type=file]');
      if (!fileInput.files.length) { out.textContent = 'Choose a file first.'; out.className = 'upload-result err'; return; }

      var fd = new FormData();
      fd.append('file', fileInput.files[0]);
      submitBtn.disabled = true;
      out.textContent = 'Uploading…'; out.className = 'upload-result';
      try {
        var res = await fetch(form.dataset.url, { method: 'POST', body: fd });
        var data = await res.json();
        if (data.ok) {
          out.textContent = '✓ ' + data.message; out.className = 'upload-result ok';
          fileInput.disabled = true;
          submitBtn.style.display = 'none';
          var dz = form.querySelector('.dropzone');
          if (dz) {
            dz.classList.add('is-done');
            var t = dz.querySelector('.dz-title'); if (t) t.textContent = 'Upload complete';
            var h = dz.querySelector('.dz-hint'); if (h) h.textContent = 'Thank you — this document has been received.';
          }
          var dot = document.querySelector('.tab-btn[data-key="' + form.dataset.key + '"] .dot');
          if (dot) dot.classList.add('done');
          updateProgress();
        } else {
          out.textContent = '✗ ' + data.message; out.className = 'upload-result err';
          submitBtn.disabled = false;
        }
      } catch (err) {
        out.textContent = '✗ Upload failed: ' + err; out.className = 'upload-result err';
        submitBtn.disabled = false;
      }
    });
    updateProgress();
  </script>
</body>
</html>
